<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sản phẩm</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body{font-family:Arial;background:#f4f6f8;margin:0;color:#222}
    .container{max-width:980px;margin:40px auto;padding:0 16px}
    .card{background:#fff;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.08);overflow:hidden}
    .head{padding:18px 22px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:12px}
    .btn{display:inline-flex;gap:8px;align-items:center;padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:800;font-size:14px}
    .btn-primary{background:#007bff;color:#fff}
    .btn-primary:hover{background:#0056b3}
    .btn-outline{border:1px solid #cfd8e3;color:#2b3a55;background:#fff}
    .btn-outline:hover{background:#f2f5f9}
    .btn-danger{background:#dc3545;color:#fff}
    .btn-danger:hover{background:#b02a37}
    table{width:100%;border-collapse:collapse}
    thead th{background:#f7f9fb;color:#555;font-size:13px;text-align:left;padding:12px 10px;border-bottom:1px solid #e9eef3}
    tbody td{padding:12px 10px;border-bottom:1px solid #eef2f6;vertical-align:top}
    .wrap{padding:14px 22px 22px}
    .msg{margin:14px 22px 0;padding:10px 12px;background:#e9f7ef;border:1px solid #b7ebc6;border-radius:8px}
    .muted{font-size:12px;color:#666;margin-top:4px}
  </style>
</head>
<body>
<div th:replace="layout/header :: header"></div>

<div class="container">
  <div class="card">
    <div class="head">
      <h2 style="margin:0;display:flex;gap:10px;align-items:center;">
        <i class="bi bi-box-seam"></i> Sản phẩm
      </h2>
      <a class="btn btn-primary" th:href="@{/products/add}">
        <i class="bi bi-plus-circle"></i> Thêm sản phẩm
      </a>
    </div>

    <div th:if="${msg}" class="msg" th:text="${msg}">Thông báo</div>

    <div class="wrap">
      <table>
  <thead>
  <tr>
    <th style="width:80px;">ID</th>
    <th style="width:110px;">Ảnh</th>
    <th>Tên</th>
    <th style="width:140px;">Giá</th>
    <th style="width:100px;">SL</th>
    <th style="width:180px;">Danh mục</th>
    <th style="width:240px;">Hành động</th>
  </tr>
  </thead>

  <tbody>
  <tr th:each="p : ${products}">
    <td th:text="${p.id}">1</td>

    <td>
      <img th:if="${p.image != null}"
           th:src="@{'/uploads/' + ${p.image}}"
           style="width:70px;height:70px;object-fit:cover;border-radius:10px;border:1px solid #ccc;">
      <span th:if="${p.image == null}" style="color:#888;">(Chưa có)</span>

      
    </td>

    <td>
      <b th:text="${p.name}">Tên</b>
      <div class="muted" th:text="${p.description}">Mô tả</div>
    </td>

    <td th:text="${p.price}">0</td>
    <td th:text="${p.quantity}">0</td>

    <td>
      <span th:each="c : ${categories}"
            th:if="${c.id == p.categoryId}"
            th:text="${c.name}">Danh mục</span>
    </td>

    <td>
      <a class="btn btn-outline" th:href="@{/products/edit/{id}(id=${p.id})}">
        <i class="bi bi-pencil-square"></i> Sửa
      </a>
      <a class="btn btn-danger" th:href="@{/products/delete/{id}(id=${p.id})}"
         onclick="return confirm('Xóa sản phẩm này?');">
        <i class="bi bi-trash"></i> Xóa
      </a>
    </td>
  </tr>
  </tbody>
</table>

    </div>

  </div>
</div>

<div th:replace="layout/footer :: footer"></div>
</body>
</html>
