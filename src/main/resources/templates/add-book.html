<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thêm sách mới</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 400px;
      margin: 80px auto;
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #007bff;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      border: none;
      color: white;
      font-size: 15px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      background-color: #0056b3;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      text-decoration: none;
      color: #007bff;
      font-size: 14px;
    }

    .back-link i {
      margin-right: 4px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
<div th:replace="layout/header :: header"></div>

<div class="container">
  <h1>
    <i class="bi bi-book"></i>
    Thêm sách mới
  </h1>

  <form th:action="@{/books}" method="post" th:object="${book}">
    <label>
      <i class="bi bi-journal-text"></i>
      Tiêu đề
    </label>
    <input type="text" th:field="*{title}"
           placeholder="Nhập tiêu đề sách" required />

    <label>
      <i class="bi bi-person"></i>
      Tác giả
    </label>
    <input type="text" th:field="*{author}"
           placeholder="Nhập tên tác giả" required />

    <button type="submit">
      <i class="bi bi-plus-circle"></i>
      Thêm sách
    </button>
  </form>

  <a th:href="@{/books}" class="back-link">
    <i class="bi bi-arrow-left"></i>
    Quay lại danh sách
  </a>
</div>
<div th:replace="layout/footer :: footer"></div>

</body>
</html>
