<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sửa sách</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    .container {
      width: 420px;
      margin: 80px auto;
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 10px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 22px;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }

    label i {
      margin-right: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #007bff;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 10px;
      background-color: #28a745;
      border: none;
      color: white;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      background-color: #1e7e34;
    }

    .back-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      text-decoration: none;
      background: #e9ecef;
      color: #333;
      font-weight: bold;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .back-btn:hover {
      background: #d6d8db;
    }
  </style>
</head>
<body>
<div th:replace="layout/header :: header"></div>

<div class="container">
  <h1>
    <i class="bi bi-pencil-square"></i>
    Sửa sách
  </h1>

  <form th:action="@{/books/update}" method="post" th:object="${book}">
   <input type="hidden" th:field="*{id}" />

    <label>
      <i class="bi bi-journal-text"></i>
      Tiêu đề
    </label>
    <input type="text" th:field="*{title}" required />

    <label>
      <i class="bi bi-person"></i>
      Tác giả
    </label>
    <input type="text" th:field="*{author}" required />

    <div class="actions">
      <button type="submit">
        <i class="bi bi-save"></i>
        Cập nhật
      </button>

      <a th:href="@{/books}" class="back-btn">
        <i class="bi bi-arrow-left"></i>
        Quay lại
      </a>
    </div>
  </form>
</div>
<div th:replace="layout/footer :: footer"></div>

</body>
</html>
