<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${mode=='edit' ? 'Sửa danh mục' : 'Thêm danh mục'}">Form</title>
  <style>
    body{font-family:Arial;background:#f4f6f8;margin:0;color:#222}
    .container{max-width:720px;margin:40px auto;padding:0 16px}
    .card{background:#fff;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.08);overflow:hidden}
    .head{padding:18px 22px;border-bottom:1px solid #eee}
    .content{padding:18px 22px}
    label{display:block;font-weight:800;margin:10px 0 6px}
    input{width:100%;padding:10px;border:1px solid #cfd8e3;border-radius:8px}
    .err{color:#dc3545;font-size:13px;margin-top:4px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .btn{padding:10px 14px;border-radius:8px;text-decoration:none;font-weight:800;border:1px solid transparent;cursor:pointer}
    .btn-primary{background:#007bff;color:#fff}
    .btn-primary:hover{background:#0056b3}
    .btn-outline{background:#fff;border:1px solid #cfd8e3;color:#2b3a55}
    .btn-outline:hover{background:#f2f5f9}
  </style>
</head>
<body>
<div th:replace="layout/header :: header"></div>

<div class="container">
  <div class="card">
    <div class="head">
      <h2 style="margin:0" th:text="${mode=='edit' ? 'Sửa danh mục' : 'Thêm danh mục'}">Form</h2>
    </div>

    <div class="content">
      <form th:object="${category}"
            th:action="${mode=='edit'} ? @{/categories/edit/{id}(id=${category.id})} : @{/categories/add}"
            method="post">

        <label>Tên danh mục</label>
        <input type="text" th:field="*{name}" placeholder="VD: Đồ điện tử"/>
        <div class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Lỗi</div>

        <div class="actions">
          <button class="btn btn-primary" type="submit"
                  th:text="${mode=='edit' ? 'Lưu thay đổi' : 'Thêm mới'}">Lưu</button>
          <a class="btn btn-outline" th:href="@{/categories}">Quay lại</a>
        </div>
      </form>
    </div>
  </div>
</div>

<div th:replace="layout/footer :: footer"></div>
</body>
</html>
